name: Diagnostics Portal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: React build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build React
        run: npm run build

  api:
    name: MySQL workflow and audit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    # These credentials belong only to the disposable CI database.
    env:
      PORT: '4000'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: portal
      DB_PASSWORD: ci_portal_password
      DB_NAME: diagnostics_portal
      JWT_SECRET: diagnostics_ci_only_secret_at_least_32_characters
      CLIENT_ORIGIN: http://localhost:5173
      API_URL: http://127.0.0.1:4000
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: diagnostics_portal
          MYSQL_USER: portal
          MYSQL_PASSWORD: ci_portal_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Create tables and seed synthetic data
        run: npm run seed
      - name: Start API and test the complete workflow
        shell: bash
        run: |
          node src/index.js > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          let ready = false;
          for (let attempt = 0; attempt < 40; attempt++) {
            try {
              const response = await fetch(`${process.env.API_URL}/api/samples`, {
                signal: AbortSignal.timeout(1000)
              });
              if (response.status === 401) {
                ready = true;
                break;
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 500));
          }
          if (!ready) throw new Error('API did not become ready');
          console.log('API ready; running workflow tests');
          JS
          npm run test:e2e
      - name: Show API logs on failure
        if: failure()
        run: |
          if [ -f api.log ]; then cat api.log; fi
